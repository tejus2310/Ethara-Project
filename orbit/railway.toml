[build]
builder = "nixpacks"
buildCommand = "npm install && cd frontend && npm install && npm run build && cd ../backend && npm install"

[deploy]
startCommand = "cd backend && node server.js"
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3

[[services]]
name = "orbit"

[services.variables]
PORT = "8080"
